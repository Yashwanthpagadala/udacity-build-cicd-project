name: Backend CD

on:
  push:
    branches:
      - master
    paths:
      - 'starter/backend/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:

  backend-lint:
    name: Backend Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install pipenv
        run: pip install pipenv

      - name: Install dependencies
        working-directory: starter/backend
        run: pipenv install --dev

      - name: Run lint
        working-directory: starter/backend
        run: pipenv run lint


  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install pipenv
        run: pip install pipenv

      - name: Install dependencies
        working-directory: starter/backend
        run: pipenv install --dev

      - name: Run tests
        working-directory: starter/backend
        run: pipenv run test


  backend-build:
    name: Backend Build
    runs-on: ubuntu-latest
    needs:
      - backend-lint
      - backend-tests

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        working-directory: starter/backend
        run: |
          IMAGE_NAME=ghcr.io/${{ github.repository_owner }}/mp-backend
          docker build \
            --tag ${IMAGE_NAME}:${{ github.sha }} \
            .
          docker push ${IMAGE_NAME}:${{ github.sha }}


  backend-deploy:
    name: Backend Deploy
    runs-on: ubuntu-latest
    needs:
      - backend-build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig \
            --region us-east-1 \
            --name cluster

      - name: Install kustomize
        run: |
          curl -sLo kustomize.tar.gz \
            https://github.com/kubernetes-sigs/kustomize/releases/latest/download/kustomize_linux_amd64.tar.gz
          tar -xzf kustomize.tar.gz
          sudo mv kustomize /usr/local/bin/kustomize

      - name: Deploy backend
        working-directory: starter/backend/k8s
        run: |
          IMAGE_NAME=ghcr.io/${{ github.repository_owner }}/mp-backend
          kustomize edit set image backend=${IMAGE_NAME}:${{ github.sha }}
          kustomize build | kubectl apply -f -
