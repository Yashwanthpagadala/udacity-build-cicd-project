name: Docker CI

on:
  push:
    branches:
      - master
    paths:
      - 'starter/frontend/**'
      - 'starter/backend/**'
      - '.github/workflows/docker-ci.yml'
  pull_request:
    branches:
      - master
    paths:
      - 'starter/frontend/**'
      - 'starter/backend/**'
      - '.github/workflows/docker-ci.yml'
  workflow_dispatch:

jobs:
  frontend-docker:
    name: Build Frontend Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Frontend Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./starter/frontend
          file: ./starter/frontend/Dockerfile
          push: false
          build-args: |
            REACT_APP_MOVIE_API_URL=http://localhost:5000
          tags: movie-frontend:ci

  backend-docker:
    name: Build Backend Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./starter/backend
          file: ./starter/backend/Dockerfile
          push: false
          tags: movie-backend:ci
